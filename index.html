<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#040d18">
    <title>JARVIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
    <div class="app">
        <header class="top">
            <h1 class="wordmark">J.A.R.V.I.S.</h1>
            <div class="status" id="status"><span class="status-dot"></span><span class="status-text">In attesa</span></div>
        </header>

        <main class="stage">
            <div class="core"><canvas id="networkCanvas" aria-hidden="true"></canvas></div>
            <section class="reply-zone" aria-live="polite">
                <p class="reply" id="lastReply">Sistema neurale avviato. Pronto ad assisterti, signore.</p>
                <p class="hint" id="listeningText">Tocca il microfono e parla</p>
            </section>
            <ul class="history" id="conversationHistory" aria-label="Messaggi precedenti">
                <li class="system">Sistema neurale avviato.</li>
            </ul>
        </main>

        <footer class="dock">
            <div class="field">
                <input type="text" id="textInput" placeholder="Scrivi un comando" autocomplete="off" enterkeyhint="send" aria-label="Scrivi un comando o una domanda">
                <button class="send-btn" id="sendBtn" aria-label="Invia">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
            <button class="mic-btn" id="micBtn" aria-label="Parla con Jarvis">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
