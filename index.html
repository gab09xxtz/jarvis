<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css?v=12">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="c"></canvas>

  <div class="app">
    <header>
      <h1>J.A.R.V.I.S.</h1>
      <span id="st">ONLINE</span>
    </header>

    <section id="auth-panel" aria-label="Account Supabase">
      <form id="auth-form">
        <input id="auth-email" type="email" placeholder="Email" autocomplete="email" required>
        <input id="auth-password" type="password" placeholder="Password (almeno 6 caratteri)" autocomplete="current-password" minlength="6" required>
        <div class="auth-actions">
          <button type="submit" id="auth-login">Accedi</button>
          <button type="button" id="auth-signup">Crea account</button>
        </div>
        <p id="auth-status" role="status">Accedi per sincronizzare note e lista spesa.</p>
      </form>
      <div id="auth-account" hidden>
        <span id="auth-user"></span>
        <button type="button" id="auth-logout">Esci</button>
      </div>
    </section>
    <main></main>

    <footer>
      <button type="button" id="mic" aria-label="Microfono">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <form id="f">
        <input id="in" type="text" placeholder="Parla o scrivi..." autocomplete="off">
        <button type="submit" id="go" aria-label="Invia">➤</button>
      </form>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js"></script>
  <script src="script.js?v=15"></script>
</body>
</html>
