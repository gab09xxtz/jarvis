<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS | Assistente Personale</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="arc-reactor">
                    <div class="core"></div>
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                </div>
                <h1>J.A.R.V.I.S.</h1>
            </div>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span class="status-text">In attesa</span>
            </div>
        </header>

        <!-- Main Interface -->
        <main class="main">
            <!-- Holographic Circle -->
            <div class="holo-container">
                <div class="holo-circle" id="holoCircle">
                    <div class="holo-inner">
                        <div class="wave" id="wave"></div>
                        <div class="wave wave-2"></div>
                        <div class="wave wave-3"></div>
                        <div class="center-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="22"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <p class="listening-text" id="listeningText">Tocca il microfono e parla</p>
            </div>

            <!-- Chat Log -->
            <div class="chat-log" id="chatLog">
                <div class="message jarvis">
                    <span class="msg-label">JARVIS</span>
                    <p>Sistema avviato. Pronto ad assisterti, signore.</p>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="mic-btn" id="micBtn" title="Parla con JARVIS">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>

                <div class="input-group">
                    <input type="text" id="textInput" placeholder="Scrivi un comando..." autocomplete="off">
                    <button class="send-btn" id="sendBtn">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Just A Rather Very Intelligent System</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
